# Site is published from the /docs folder on branch main (see publish-web.ps1).
# This workflow is intentionally NOT run on push — it avoids failed-deploy emails when
# GitHub Pages is set to "Deploy from branch /docs" instead of "GitHub Actions".
#
# To publish: run .\publish-web.ps1 then git push origin main

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Pages uses docs/ on main
        run: |
          echo "No Action deploy needed."
          echo "Enable Pages: Settings → Pages → Source: branch main, folder /docs"
          echo "Or run publish-web.ps1 locally and push docs/ to main."
