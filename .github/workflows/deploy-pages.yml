# Publishes prebuilt Flutter web output from /docs to the gh-pages branch.
# Run publish-web.ps1 locally, commit docs/, then push main.
#
# GitHub Pages settings (one-time):
#   Settings → Pages → Deploy from branch → gh-pages → / (root)
# Do NOT use "GitHub Actions" as Pages source (avoids double-deploy timeouts).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs site
        run: test -f docs/index.html

      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
          commit-message: 'Deploy web build from main'
