# Builds Flutter web and deploys via GitHub Actions Pages only.
# Do NOT commit a full Flutter build to docs/ — that triggers a conflicting legacy Pages job.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Force GitHub Actions as Pages source (stops branch deploy conflicts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"workflow","cname":"ngmy.org","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d '{"build_type":"workflow","cname":"ngmy.org"}')
          echo "PUT Pages HTTP ${code}"
          cat /tmp/pages.json || true
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d '{"build_type":"workflow","cname":"ngmy.org"}')
            echo "POST Pages HTTP ${code}"
            cat /tmp/pages.json || true
          fi
          sleep 2
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" | tee /tmp/pages-verify.json
          if ! grep -q '"build_type":"workflow"' /tmp/pages-verify.json && ! grep -q '"build_type": "workflow"' /tmp/pages-verify.json; then
            echo "::warning::Pages may still be on legacy branch deploy — set Source to GitHub Actions in repo Settings → Pages"
          fi

  build:
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href=/ --no-wasm-dry-run --no-web-resources-cdn
          test -f build/web/index.html

      - name: Prepare site folder
        run: |
          set -e
          rm -rf _site
          cp -r build/web _site
          touch _site/.nojekyll
          printf '%s' 'ngmy.org' > _site/CNAME
          DEPLOY_ID=$(date -u +%Y%m%d%H%M%S)
          printf '{"build_number":"%s","deployed_at":"%s","app_name":"ngmy","version":"1.0.0","package_name":"ngmy"}\n' \
            "$DEPLOY_ID" "$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" > _site/version.json

          cp _site/index.html _site/404.html

          if [ -f _site/flutter_bootstrap.js ]; then
            python3 - <<'PY'
          import pathlib, re

          p = pathlib.Path("_site/flutter_bootstrap.js")
          boot = p.read_text(encoding="utf-8")
          boot = boot.replace(",{}", "")
          boot = re.sub(r",?\s*serviceWorkerSettings:\s*\{[^}]*\}", "", boot)

          loader = """// NGMY: use ngmy_service_worker.js (registered in index.html) — not Flutter's worker.
          _flutter.loader.load({
            config: {
              canvasKitBaseUrl: "./canvaskit/",
              useLocalCanvasKit: true
            }
          }).catch(function (e) {
            console.error("[ngmy] Flutter load failed", e);
            window.__ngmyShowLoadError && window.__ngmyShowLoadError(
              "NGMY could not load the app engine. Tap Reload. If you are offline, open once on Wi-Fi and wait for the home screen."
            );
          });"""

          if "// NGMY: use ngmy_service_worker" in boot:
            boot = re.sub(
              r"// NGMY: use ngmy_service_worker\.js[^\n]*\n.*",
              loader,
              boot,
              count=1,
              flags=re.S,
            )
          elif "_flutter.loader.load();" in boot:
            boot = boot.replace("_flutter.loader.load();", loader)
          elif "_flutter.loader.load({" in boot:
            boot = re.sub(
              r"_flutter\.loader\.load\(\{.*\}\)(?:\.catch\(function \(e\) \{.*?\}\))?;?\s*",
              loader,
              boot,
              count=1,
              flags=re.S,
            )

          boot = re.sub(r"\}\);\s*\.catch\(", "}).catch(", boot)
          p.write_text(boot, encoding="utf-8")
          print("patched flutter_bootstrap.js")
          PY
          fi
          rm -f _site/flutter_service_worker.js

          if [ -f web/ngmy_service_worker.js ]; then
            python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("_site")
          urls = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.name == "ngmy_service_worker.js":
                  continue
              urls.append("./" + p.relative_to(root).as_posix())
          tpl = pathlib.Path("web/ngmy_service_worker.js").read_text(encoding="utf-8")
          bid = json.loads(root.joinpath("version.json").read_text(encoding="utf-8-sig"))["build_number"]
          out = tpl.replace("__NGMY_DEPLOY_ID__", bid).replace("__NGMY_PRECACHE_URLS__", json.dumps(urls))
          root.joinpath("ngmy_service_worker.js").write_text(out, encoding="utf-8")
          print(f"service worker: {len(urls)} precache URLs")
          PY
          fi
          for f in _site/index.html _site/404.html; do
            if [ -f "$f" ]; then
              python3 -c "
          import pathlib, json
          bid = json.load(open('_site/version.json'))['build_number']
          p = pathlib.Path('$f')
          p.write_text(p.read_text(encoding='utf-8').replace('__NGMY_DEPLOY_ID__', bid), encoding='utf-8')
          "
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
