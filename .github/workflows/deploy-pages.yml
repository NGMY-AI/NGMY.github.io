# Builds Flutter web and deploys via GitHub Pages Actions.
# A tiny docs/ stub on main keeps GitHub's built-in "pages build and deployment" from failing.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages to GitHub Actions (stop branch deploy failures)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"workflow","cname":"ngmy.org"}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d "$body")
          echo "PUT Pages HTTP ${code}"
          cat /tmp/pages.json || true
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d "$body")
            echo "POST Pages HTTP ${code}"
            cat /tmp/pages.json || true
          fi

  build:
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href=/ --no-wasm-dry-run --no-web-resources-cdn
          test -f build/web/index.html

      - name: Prepare site folder
        run: |
          set -e
          rm -rf _site
          cp -r build/web _site
          touch _site/.nojekyll
          printf '%s' 'ngmy.org' > _site/CNAME
          DEPLOY_ID=$(date -u +%Y%m%d%H%M%S)
          printf '{"build_number":"%s","deployed_at":"%s","app_name":"ngmy","version":"1.0.0","package_name":"ngmy"}\n' \
            "$DEPLOY_ID" "$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)" > _site/version.json
          if [ -f web/ngmy_service_worker.js ]; then
            python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("_site")
          urls = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.name == "ngmy_service_worker.js":
                  continue
              urls.append("./" + p.relative_to(root).as_posix())
          tpl = pathlib.Path("web/ngmy_service_worker.js").read_text(encoding="utf-8")
          bid = json.loads(root.joinpath("version.json").read_text(encoding="utf-8-sig"))["build_number"]
          out = tpl.replace("__NGMY_DEPLOY_ID__", bid).replace("__NGMY_PRECACHE_URLS__", json.dumps(urls))
          root.joinpath("ngmy_service_worker.js").write_text(out, encoding="utf-8")
          print(f"service worker: {len(urls)} precache URLs")
          PY
          fi
          for f in _site/index.html _site/404.html; do
            if [ -f "$f" ]; then
              python3 -c "
          import pathlib, json
          bid = json.load(open('_site/version.json'))['build_number']
          p = pathlib.Path('$f')
          p.write_text(p.read_text(encoding='utf-8').replace('__NGMY_DEPLOY_ID__', bid), encoding='utf-8')
          "
            fi
          done

      - name: Mirror to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          commit-message: 'Deploy web build from CI'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
