# Deploy prebuilt Flutter web output from /docs on push to main.
# Run publish-web.ps1 locally first, then push docs/ + lib/ changes.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs site
        run: |
          test -f docs/index.html || (echo "Missing docs/index.html — run publish-web.ps1 first" && exit 1)
          test -f docs/.nojekyll || echo "docs/.nojekyll missing (Jekyll may ignore _underscore paths)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
