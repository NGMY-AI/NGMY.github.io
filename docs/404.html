    (function () {
      function ngmyBasePath() {
        var host = (location.hostname || '').toLowerCase();
        if (host === 'ngmy.org' || host === 'www.ngmy.org') return '/';
        var p = location.pathname || '/';
        if (p.indexOf('/NGMY.github.io') === 0) return '/NGMY.github.io/';
        if (host.indexOf('github.io') !== -1) return '/NGMY.github.io/';
        return '/';
      }
      window.__NGMY_BASE_PATH__ = ngmyBasePath();
      var b = document.querySelector('base');
      if (b) b.setAttribute('href', window.__NGMY_BASE_PATH__);
    })();
  </script>

  <script>
    (function () {
      var embedded = '20260712044330';
      var base = window.__NGMY_BASE_PATH__ || '/';
      var KEY = 'ngmy_deploy_id';
      function forceRefreshForBuild(serverBuild) {
        if (!serverBuild) return;
        // Up to date: live HTML shell matches server — never reload on SW activate alone.
        if (serverBuild === embedded) {
          try { localStorage.setItem(KEY, serverBuild); } catch (e) {}
          return;
        }
        var onceKey = 'ngmy_force_reload_' + serverBuild;
        if (sessionStorage.getItem(onceKey)) return;
        sessionStorage.setItem(onceKey, '1');
        try { localStorage.setItem(KEY, serverBuild); } catch (e) {}
        var done = function () { location.replace(location.pathname + location.search + (location.search ? '&' : '?') + '_=' + Date.now()); };
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if ('caches' in window) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (k) { return k.indexOf('ngmy-pwa-') === 0; }).map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(done).catch(done);
        } else {
          done();
        }
      }
      window.__ngmyForceRefreshForBuild = forceRefreshForBuild;
      fetch(base + 'version.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (v && v.build_number) forceRefreshForBuild(v.build_number);
        })
        .catch(function () {});
    })();
  </script>

    (function () {
      function ngmyThemeIsLight() {
        try {
          var keys = ['flutter.theme_mode', 'theme_mode'];
          for (var i = 0; i < keys.length; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'dark') return false;
            if (v === 'light') return true;
          }
        } catch (e) {}
        return false;
      }
      function ngmyApplyLightChromeEarly() {
        var root = document.documentElement;
        root.classList.add('ngmy-app-light');
        root.classList.remove('ngmy-app-dark');
        root.style.setProperty('background-color', '#ffffff', 'important');

        if (statusMeta) statusMeta.setAttribute('content', 'black');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#ffffff');
        });
      }
      function ngmyApplyDarkChromeEarly() {
        var root = document.documentElement;
        root.classList.remove('ngmy-app-light');
        root.classList.add('ngmy-app-dark');
        root.style.setProperty('background-color', '#121212', 'important');

                  if (path === 'main.dart.js' && window.__NGMY_MAIN_BLOB) mapped = window.__NGMY_MAIN_BLOB;
                }
              }
              srcDesc.set.call(this, mapped);
            },
            configurable: true,
          });
        }
      }

      function offlineShellReady(cache) {
        if (!cache) return Promise.resolve(false);
        var required = [
          'flutter_bootstrap.js',
          'main.dart.js',
          'canvaskit/canvaskit.js',
          'canvaskit/canvaskit.wasm',
          'canvaskit/chromium/canvaskit.js',
          'canvaskit/chromium/canvaskit.wasm',
        ];
        return required.reduce(function (chain, path) {
          return chain.then(function (ok) {
            if (!ok) return false;
            return loadFromCache(cache, path).then(function (hit) { return !!hit; });
          });

      }

      function waitForServiceWorkerControl(maxMs) {

        if (navigator.serviceWorker.controller) return Promise.resolve(true);
        return new Promise(function (resolve) {

            resolve(!!ok);
          };

      function registerServiceWorkerAndWait() {
        if (!('serviceWorker' in navigator)) return Promise.resolve(null);
        return navigator.serviceWorker
          .register('ngmy_service_worker.js?v=' + deployId, { scope: swScope })
          .then(function (reg) {
            if (navigator.serviceWorker.controller) return reg;
            return navigator.serviceWorker.ready.then(function () { return reg; }).catch(function () { return reg; });
          })
          .catch(function (e) {
            console.warn('[ngmy] sw register', e);

          });

      function registerServiceWorkerBackground() {
        registerServiceWorkerAndWait();
      }

      function sanitizeBootstrap(code) {
        if (!code) return code;
        // Repair broken deploys that left invalid `});.catch(` JavaScript.
        return code.replace(/\}\);\s*\.catch\(/g, '}).catch(');
      }

      function verifyBootstrapReady(deadlineMs) {
        return new Promise(function (resolve, reject) {
          var start = Date.now();
          (function check() {

              return;
            }
            if (Date.now() - start > deadlineMs) {

              return;
            }
            setTimeout(check, 120);

      function injectBootstrap(code) {

        s.textContent = code;
        s.async = false;
        try {
          document.head.appendChild(s);
        } catch (e) {
          return Promise.reject(e);
        }
        warmOfflineCache();
        return verifyBootstrapReady(12000);
      }

      function fetchBootstrapText(url) {
        return fetch(url, { cache: 'no-cache' }).then(function (resp) {
          if (!resp.ok) throw new Error('bootstrap fetch failed');
          return resp.text();
        });
      }

      function fallbackToOfflineCache() {
        return openOfflineCache().then(function (cache) {
          if (!cache) {
            showBootstrapError();
            return;
          }
          return offlineShellReady(cache).then(function (ready) {
            if (ready) return runBootstrapFromCache(cache);
            showBootstrapError('Open NGMY once on mobile data or home Wi-Fi, wait for the home screen, then you can use it offline. School or library Wi-Fi may block the server.');
          });
        });
      }

      function runBootstrapFromCache(cache) {
        loadAttempts += 1;
        installCacheHooks(cache);
        window.__NGMY_MAIN_BLOB_PATH = new URL('main.dart.js', location.href).href;

        return loadFromCache(cache, 'main.dart.js').then(function (mainHit) {
          if (!mainHit) throw new Error('main.dart.js missing');
          return mainHit.blob().then(function (blob) {
            window.__NGMY_MAIN_BLOB = URL.createObjectURL(blob);
            return loadFromCache(cache, 'flutter_bootstrap.js');
          });
        }).then(function (bootHit) {
          if (!bootHit) throw new Error('bootstrap missing');
          return bootHit.text().then(function (code) {
            return injectBootstrap(code);
          });
        }).catch(function () {

            return runBootstrapFromCache(cache);
          }
          showBootstrapError();
        });
      }

      function bootFromNetwork() {
        loadAttempts += 1;
        fetchBootstrapText('flutter_bootstrap.js?v=' + deployId)
          .then(function (code) {
            return injectBootstrap(code);
          })
          .catch(function () {
            if (loadAttempts < 2) {
              setTimeout(bootFromNetwork, 600);
              return;
            }
            fallbackToOfflineCache();
          });
      }

      function startApp() {
        var bootTimer = setTimeout(function () {
          showBootstrapError('NGMY is still loading. If you are on school or library Wi-Fi, try home internet or mobile data, then tap Reload.');
        }, 180000);

        var bootstrapTimer = setTimeout(function () {
          if (!window._flutter || !window._flutter.loader) {
            showBootstrapError('NGMY engine failed to start. Tap Reload. If this keeps happening, clear website data for ngmy.org and open again on home Wi-Fi or mobile data.');
          }

        window.addEventListener('flutter-first-frame', function () {
          clearTimeout(bootTimer);
          clearTimeout(bootstrapTimer);
          window.__ngmyHideSplash && window.__ngmyHideSplash();
        }, { once: true });

        registerServiceWorkerAndWait();

        if (navigator.onLine) {
          bootFromNetwork();
          return;
        }

        Promise.all([
          waitForServiceWorkerControl(15000),
          openOfflineCache(),
        ]).then(function (results) {
          var controlled = results[0];
          var cache = results[1];
          if (controlled) {
            bootFromNetwork();
            return;
          }
          return offlineShellReady(cache).then(function (ready) {
            if (ready) return runBootstrapFromCache(cache);
            showBootstrapError('Open NGMY once on mobile data or home Wi-Fi, wait for the home screen, then you can use it offline. School or library Wi-Fi may block the server.');
          });
        }).catch(function () {
          bootFromNetwork();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }

      window.addEventListener('pagehide', warmOfflineCache);
    })();
