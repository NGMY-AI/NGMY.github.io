<!DOCTYPE html>

<html>

<head>

  <base href="/">

  <script>
    (function () {
      function ngmyBasePath() {
        var host = (location.hostname || '').toLowerCase();
        if (host === 'ngmy.org' || host === 'www.ngmy.org') return '/';
        var p = location.pathname || '/';
        if (p.indexOf('/NGMY.github.io') === 0) return '/NGMY.github.io/';
        if (host.indexOf('github.io') !== -1) return '/NGMY.github.io/';
        return '/';
      }
      window.__NGMY_BASE_PATH__ = ngmyBasePath();
      var b = document.querySelector('base');
      if (b) b.setAttribute('href', window.__NGMY_BASE_PATH__);
    })();
  </script>

  <script>
    (function () {
      function ngmyExtractGuestAppSlug() {
        var path = location.pathname || "";
        var m = path.match(/\/app\/([^/?#]+)/i);
        if (m && m[1]) return m[1].trim().toLowerCase();
        try {
          var q = new URLSearchParams(location.search).get("ngmy_app");
          if (q) return q.trim().toLowerCase();
        } catch (e) {}
        var hash = (location.hash || "").replace(/^#\/?/, "");
        if (hash.indexOf("app/") === 0) {
          var part = hash.substring(4).split("/")[0];
          if (part) return part.trim().toLowerCase();
        }
        return "";
      }
      var slug = ngmyExtractGuestAppSlug();
      if (slug) {
        try { sessionStorage.setItem("ngmy_guest_app_slug", slug); } catch (e) {}
        try { document.title = "Loading appâ€¦"; } catch (e2) {}
      }
    })();
  </script>



  <meta charset="UTF-8">

  <script>
    (function () {
      function ngmyThemeIsLight() {
        try {
          var keys = ['flutter.theme_mode', 'theme_mode'];
          for (var i = 0; i < keys.length; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'dark') return false;
            if (v === 'light') return true;
          }
        } catch (e) {}
        var h = new Date().getHours();
        return h >= 9 && h < 20;
      }
      function ngmyApplyLightChromeEarly() {
        var root = document.documentElement;
        root.classList.add('ngmy-app-light');
        root.style.setProperty('background-color', '#ffffff', 'important');
        root.style.setProperty('color-scheme', 'light');
        if (document.body) {
          document.body.style.setProperty('background-color', '#ffffff', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#ffffff');
        });
      }
      function ngmyApplyDarkChromeEarly() {
        var root = document.documentElement;
        root.classList.remove('ngmy-app-light');
        root.style.setProperty('background-color', '#121212', 'important');
        root.style.setProperty('color-scheme', 'dark');
        if (document.body) {
          document.body.style.setProperty('background-color', '#121212', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#121212');
        });
      }
      if (ngmyThemeIsLight()) ngmyApplyLightChromeEarly();
      else ngmyApplyDarkChromeEarly();
    })();
  </script>

  <style>

    html, body {

      margin: 0;

      padding: 0;

      height: 100%;

      background-color: #ffffff;

      html, body { background-color: #ffffff; }

      background-color: #ffffff;

      -webkit-user-select: text;

      user-select: text;

    }

    flt-semantics, .flt-text-editing {

      -webkit-user-select: text;

      user-select: text;

    }

    @media (prefers-color-scheme: light) {

      html, body, flutter-view, flt-glass-pane {

        background-color: #ffffff !important;

      }

    }

    @media (prefers-color-scheme: dark) {

      html, body { background-color: #121212; }

    html.ngmy-app-light,
    html.ngmy-app-light body {

      background-color: #ffffff !important;

    }

    html.ngmy-app-light flutter-view,

      background-color: #ffffff !important;

    }

    html.ngmy-app-light::before {

      content: '';

      position: fixed;

      top: 0;

      left: 0;

      right: 0;

      height: env(safe-area-inset-top, 0px);

      z-index: 2147483646;

      pointer-events: none;

    }

    #ngmy-splash {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 16px;

      background: inherit;

      font-family: system-ui, sans-serif;

    }

    #ngmy-splash .ngmy-spin {

      width: 40px;

      height: 40px;

      border: 3px solid rgba(0, 178, 90, 0.25);

      border-top-color: #00B25A;

      border-radius: 50%;

      animation: ngmy-spin 0.9s linear infinite;

    }

    @keyframes ngmy-spin {

      to { transform: rotate(360deg); }

    #ngmy-splash p {

    }

<body>

  <div id="ngmy-splash">

    <div class="ngmy-spin"></div>

    <p id="ngmy-splash-msg">Loading NGMYâ€¦</p>

  </div>

  <div id="ngmy-error">

    <p style="font-size:18px;font-weight:800">NGMY could not start</p>

    <p id="ngmy-error-msg" style="opacity:0.8;max-width:320px"></p>

    <button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:none;border-radius:8px;background:#00B25A;color:#fff;font-weight:700">Reload</button>

  </div>

  <script>

    (function () {

      var KEY = "ngmy_deploy_id";

      var CURRENT = "20260612221341";

      function showError(msg) {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

        var err = document.getElementById("ngmy-error");

        var msgEl = document.getElementById("ngmy-error-msg");

        if (err) err.style.display = "flex";

        if (msgEl) msgEl.textContent = msg || "Clear site data for this URL, then reload.";

      }

      function hideSplash() {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

      }

      window.__ngmyShowLoadError = showError;
      window.__ngmyHideSplash = hideSplash;

      try {

        var prev = localStorage.getItem(KEY);

        if (prev && prev !== CURRENT && navigator.onLine && "serviceWorker" in navigator) {

          navigator.serviceWorker.getRegistrations().then(function (regs) {

            return Promise.all(regs.map(function (r) { return r.unregister(); }));

          }).then(function () {

            if ("caches" in window) {

              return caches.keys().then(function (keys) {

                return Promise.all(keys.map(function (k) { return caches.delete(k); }));

              });

            }

          }).catch(function () {});

        }

        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}

      } catch (e) {}

    })();

  </script>

  <script>
    (function () {
      function scrollTopOnce() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      window.addEventListener('pageshow', scrollTopOnce);
    })();
  </script>

  <script>
    (function () {
      var deployId = '20260612221341';
      var bootstrapSrc = 'flutter_bootstrap.js';
      var loadAttempts = 0;

      function showBootstrapError() {
        var hint = navigator.onLine
            ? 'Could not load the app. Try https://ngmy.org/ or clear site data and reload.'
            : 'You are offline. Open NGMY once while online so it can save for offline use, then try again.';
        window.__ngmyShowLoadError && window.__ngmyShowLoadError(hint);
      }

      function loadFlutterBootstrap() {
        loadAttempts += 1;
        var s = document.createElement('script');
        s.src = bootstrapSrc;
        s.async = false;
        s.onload = function () {
          var obs = new MutationObserver(function () {
            if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || window._flutter) {
              window.__ngmyHideSplash && window.__ngmyHideSplash();
              obs.disconnect();
            }
          });
          obs.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { window.__ngmyHideSplash && window.__ngmyHideSplash(); }, 12000);
        };
        s.onerror = function () {
          if (loadAttempts < 3) {
            setTimeout(loadFlutterBootstrap, loadAttempts === 1 ? 400 : 1200);
            return;
          }
          showBootstrapError();
        };
        document.body.appendChild(s);
      }

      function cacheHasBootstrap() {
        if (!('caches' in window)) return Promise.resolve(false);
        return caches.keys().then(function (keys) {
          var ngmyKeys = keys.filter(function (k) { return k.indexOf('ngmy-pwa-') === 0; });
          if (!ngmyKeys.length) return false;
          return Promise.all(ngmyKeys.map(function (key) {
            return caches.open(key).then(function (cache) {
              var candidates = ['./flutter_bootstrap.js', 'flutter_bootstrap.js'];
              return Promise.all(candidates.map(function (u) {
                return cache.match(u).then(function (hit) { return !!hit; });
              })).then(function (hits) { return hits.some(Boolean); });
            });
          })).then(function (results) { return results.some(Boolean); });
        }).catch(function () { return false; });
      }

      function startApp() {
        var bootStarted = false;
        var go = function () {
          if (bootStarted) return;
          bootStarted = true;
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadFlutterBootstrap);
          } else {
            loadFlutterBootstrap();
          }
        };
        if (!navigator.onLine) {
          var splashMsg = document.getElementById('ngmy-splash-msg');
          if (splashMsg) splashMsg.textContent = 'Opening offlineâ€¦';
          var offlineGo = function () {
            cacheHasBootstrap().then(function (has) {
              if (has) go();
              else showBootstrapError();
            });
          };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(offlineGo).catch(offlineGo);
            setTimeout(offlineGo, 2500);
          } else {
            offlineGo();
          }
          return;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(go).catch(go);
          setTimeout(go, 1200);
        } else {
          go();
        }
      }

      setTimeout(function () {
        if (!document.querySelector('flutter-view') && !window._flutter) {
          if (!navigator.onLine) showBootstrapError();
        }
      }, 22000);

      if (!('serviceWorker' in navigator)) {
        startApp();
        return;
      }

      var swScope = window.__NGMY_BASE_PATH__ || '/';
      navigator.serviceWorker.register('ngmy_service_worker.js?v=' + deployId, { scope: swScope })
        .catch(function (e) {
          console.warn('[ngmy] service worker register failed', e);
        });
      startApp();
    })();
  </script>
