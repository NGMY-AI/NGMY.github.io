    <p id="ngmy-error-msg" style="opacity:0.8;max-width:320px"></p>

  </div>

  <script>

    (function () {

      var KEY = "ngmy_deploy_id";

      var CURRENT = "20260531175136";

      function showError(msg) {

        var err = document.getElementById("ngmy-error");

        var msgEl = document.getElementById("ngmy-error-msg");

        if (err) err.style.display = "flex";

        if (msgEl) msgEl.textContent = msg || "Clear site data for this URL, then reload.";

      }

      window.__ngmyShowLoadError = showError;

      try {

        var prev = localStorage.getItem(KEY);

        if (prev && prev !== CURRENT && "serviceWorker" in navigator) {

          navigator.serviceWorker.getRegistrations().then(function (regs) {

            return Promise.all(regs.map(function (r) { return r.unregister(); }));

          }).then(function () {

            if ("caches" in window) {

              return caches.keys().then(function (keys) {

                return Promise.all(keys.map(function (k) { return caches.delete(k); }));

              });

            }

          }).catch(function () {});

        }

        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}

      } catch (e) {}

    })();

  </script>

  <script>
    (function () {
      function forceViewportReset() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
        try { window.dispatchEvent(new Event('resize')); } catch (e) {}
      }

      function scheduleViewportSync() {
        forceViewportReset();
        setTimeout(forceViewportReset, 50);
        setTimeout(forceViewportReset, 150);
        setTimeout(forceViewportReset, 400);
        setTimeout(forceViewportReset, 1000);
        setTimeout(forceViewportReset, 2000);
      }

      window.addEventListener('load', scheduleViewportSync);
      window.addEventListener('pageshow', function (event) {
        scheduleViewportSync();
      });

      document.addEventListener('touchstart', function () {
        if (window.scrollY !== 0 || (window.visualViewport && window.visualViewport.offsetTop !== 0)) {
          forceViewportReset();
        }
      }, { passive: true });

      if (window.visualViewport) {
        var timer;
        function onViewportChange() {
          clearTimeout(timer);
          timer = setTimeout(forceViewportReset, 16);
        }
        window.visualViewport.addEventListener('resize', onViewportChange);
        window.visualViewport.addEventListener('scroll', onViewportChange);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js?v=20260531175136" onerror="window.__ngmyShowLoadError && window.__ngmyShowLoadError('Could not load the app. Use this exact link: https://ngmy-ai.github.io/NGMY.github.io/')"></script>

  <script>
