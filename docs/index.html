  <script>
    (function () {
      function ngmyBasePath() {
        var host = (location.hostname || '').toLowerCase();
        if (host === 'ngmy.org' || host === 'www.ngmy.org') return '/';
        var p = location.pathname || '/';
        if (p.indexOf('/NGMY.github.io') === 0) return '/NGMY.github.io/';
        if (host.indexOf('github.io') !== -1) return '/NGMY.github.io/';
        return '/';
      }
      window.__NGMY_BASE_PATH__ = ngmyBasePath();
      var b = document.querySelector('base');
      if (b) b.setAttribute('href', window.__NGMY_BASE_PATH__);
    })();
  </script>

  <script>
    (function () {
      function ngmyExtractGuestAppSlug() {
        var path = location.pathname || "";
        var m = path.match(/\/app\/([^/?#]+)/i);
        if (m && m[1]) return m[1].trim().toLowerCase();
        try {
          var q = new URLSearchParams(location.search).get("ngmy_app");
          if (q) return q.trim().toLowerCase();
        } catch (e) {}
        var hash = (location.hash || "").replace(/^#\/?/, "");
        if (hash.indexOf("app/") === 0) {
          var part = hash.substring(4).split("/")[0];
          if (part) return part.trim().toLowerCase();
        }
        return "";
      }
      var slug = ngmyExtractGuestAppSlug();
      if (slug) {
        try { sessionStorage.setItem("ngmy_guest_app_slug", slug); } catch (e) {}
        try { document.title = "Loading appâ€¦"; } catch (e2) {}
      }
    })();
  </script>

  <script>
    (function () {
      function ngmyThemeIsLight() {
        try {
          var keys = ['flutter.theme_mode', 'theme_mode'];
          for (var i = 0; i < keys.length; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'dark') return false;
            if (v === 'light') return true;
          }
        } catch (e) {}
        var h = new Date().getHours();
        return h >= 9 && h < 20;
      }
      function ngmyApplyLightChromeEarly() {
        var root = document.documentElement;
        root.classList.add('ngmy-app-light');
        root.classList.remove('ngmy-app-dark');
        root.style.setProperty('background-color', '#ffffff', 'important');
        root.style.setProperty('color-scheme', 'light');
        if (document.body) {
          document.body.style.setProperty('background-color', '#ffffff', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#ffffff');
        });
      }
      function ngmyApplyDarkChromeEarly() {
        var root = document.documentElement;
        root.classList.remove('ngmy-app-light');
        root.classList.add('ngmy-app-dark');
        root.style.setProperty('background-color', '#121212', 'important');
        root.style.setProperty('color-scheme', 'dark');
        if (document.body) {
          document.body.style.setProperty('background-color', '#121212', 'important');
        }
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function (el) {
          el.style.setProperty('background-color', '#121212', 'important');
        });
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#121212');
        });
      }
      if (ngmyThemeIsLight()) ngmyApplyLightChromeEarly();
      else ngmyApplyDarkChromeEarly();
    })();
  </script>

  <script>

    (function () {

      var KEY = "ngmy_deploy_id";

      var CURRENT = "20260614091927";

      function showError(msg) {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

        var err = document.getElementById("ngmy-error");

        var msgEl = document.getElementById("ngmy-error-msg");

        if (err) err.style.display = "flex";

        if (msgEl) msgEl.textContent = msg || "Clear site data for this URL, then reload.";

      }

      function hideSplash() {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

      }

      window.__ngmyShowLoadError = showError;
      window.__ngmyHideSplash = hideSplash;

      try {

        var prev = localStorage.getItem(KEY);

        // New deploy: let the service worker swap caches on activate â€” do not wipe
        // storage here or offline cold start breaks before the new shell is cached.

        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}

      } catch (e) {}

    })();

  </script>

  <script>

  <script>
    (function () {
      var deployId = '20260614091927';
      var loadAttempts = 0;
      var swScope = window.__NGMY_BASE_PATH__ || '/';
      var cacheBootActive = false;
      var activeCache = null;

      var OFFLINE_CRITICAL = [
        'flutter_bootstrap.js',
        'main.dart.js',
        'canvaskit/canvaskit.js',
        'canvaskit/canvaskit.wasm',
        'assets/AssetManifest.bin.json',
        'assets/FontManifest.json',
      ];

      function showBootstrapError(hint) {
        var msg = hint || 'Could not open NGMY. Open once with Wi-Fi on, wait for the home screen, then try again.';
        window.__ngmyShowLoadError && window.__ngmyShowLoadError(msg);
      }

      function pathFromUrl(src) {
        try {
          var u = new URL(src, location.href);
          if (u.origin !== location.origin) return null;
          var p = u.pathname || '';
          var base = swScope || '/';
          if (base !== '/' && p.indexOf(base) === 0) p = p.substring(base.length);
          if (p.charAt(0) === '/') p = p.substring(1);
          return p;
        } catch (e) {
          return null;
        }
      }

      function openOfflineCache() {
        if (!('caches' in window)) return Promise.resolve(null);
        return caches.keys().then(function (keys) {
          var ngmyKeys = keys.filter(function (k) { return k.indexOf('ngmy-pwa-') === 0; });
          if (!ngmyKeys.length) return null;
          return caches.open(ngmyKeys[ngmyKeys.length - 1]);
        });
      }

      function loadFromCache(cache, path) {
        if (!cache || !path) return Promise.resolve(null);
        return cache.match('./' + path).then(function (hit) {
          if (hit) return hit;
          return cache.match(path);
        }).then(function (hit) {
          if (hit) return hit;
          return cache.keys().then(function (reqs) {
            for (var i = 0; i < reqs.length; i++) {
              if ((reqs[i].url || '').indexOf(path) !== -1) return cache.match(reqs[i]);
            }
            return null;
          });
        });
      }

      function warmOfflineCache() {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        try {
          navigator.serviceWorker.controller.postMessage({ type: 'ENSURE_CACHED', urls: OFFLINE_CRITICAL });
        } catch (e) {}
      }

      function installCacheHooks(cache) {
        if (!cache || window.__ngmyCacheHooks) return;
        window.__ngmyCacheHooks = true;
        activeCache = cache;
        cacheBootActive = true;

        if (window.fetch && !window.__ngmyFetchHooked) {
          window.__ngmyFetchHooked = true;
          var origFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            var path = pathFromUrl(url);
            if (path) {
              return loadFromCache(cache, path).then(function (hit) {
                if (hit) return hit;
                return origFetch(input, init).catch(function () {
                  return loadFromCache(cache, path);
                });
              });
            }
            return origFetch(input, init);
          };
        }

        var srcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
        if (srcDesc && srcDesc.set && !window.__ngmySrcHooked) {
          window.__ngmySrcHooked = true;
          Object.defineProperty(HTMLScriptElement.prototype, 'src', {
            get: srcDesc.get,
            set: function (val) {
              var mapped = val;
              if (cacheBootActive) {
                if (val === window.__NGMY_MAIN_BLOB_PATH && window.__NGMY_MAIN_BLOB) {
                  mapped = window.__NGMY_MAIN_BLOB;
                } else {
                  var path = pathFromUrl(val);
                  if (path === 'main.dart.js' && window.__NGMY_MAIN_BLOB) mapped = window.__NGMY_MAIN_BLOB;
                }
              }
              srcDesc.set.call(this, mapped);
            },
            configurable: true,
          });
        }
      }

      function offlineShellReady(cache) {
        if (!cache) return Promise.resolve(false);
        return loadFromCache(cache, 'flutter_bootstrap.js').then(function (a) {
          if (!a) return false;
          return loadFromCache(cache, 'main.dart.js').then(function (b) { return !!b; });
        });
      }

      function registerServiceWorkerBackground() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker
          .register('ngmy_service_worker.js?v=' + deployId, { scope: swScope })
          .catch(function (e) { console.warn('[ngmy] sw register', e); });
      }

      function runBootstrapFromCache(cache) {
        loadAttempts += 1;
        installCacheHooks(cache);
        window.__NGMY_MAIN_BLOB_PATH = new URL('main.dart.js', location.href).href;

        return loadFromCache(cache, 'main.dart.js').then(function (mainHit) {
          if (!mainHit) throw new Error('main.dart.js missing');
          return mainHit.blob().then(function (blob) {
            window.__NGMY_MAIN_BLOB = URL.createObjectURL(blob);
            return loadFromCache(cache, 'flutter_bootstrap.js');
          });
        }).then(function (bootHit) {
          if (!bootHit) throw new Error('bootstrap missing');
          return bootHit.text().then(function (code) {
            var s = document.createElement('script');
            s.textContent = code;
            s.async = false;
            document.head.appendChild(s);
            warmOfflineCache();
          });
        }).catch(function () {
          if (loadAttempts < 2) {
            return runBootstrapFromCache(cache);
          }
          showBootstrapError();
        });
      }

      function loadFlutterBootstrapOnline() {
        loadAttempts += 1;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = false;
        s.onerror = function () {
          if (loadAttempts < 2) {
            setTimeout(loadFlutterBootstrapOnline, 500);
            return;
          }
          openOfflineCache().then(function (cache) {
            if (cache) return runBootstrapFromCache(cache);
            showBootstrapError();
          });
        };
        document.head.appendChild(s);
        warmOfflineCache();
      }

      function bootFromNetwork() {
        var timer = setTimeout(function () {
          openOfflineCache().then(function (cache) {
            if (!cache) return;
            offlineShellReady(cache).then(function (ready) {
              if (ready) runBootstrapFromCache(cache);
            });
          });
        }, 4000);
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = false;
        s.onload = function () { clearTimeout(timer); warmOfflineCache(); };
        s.onerror = function () {
          clearTimeout(timer);
          openOfflineCache().then(function (cache) {
            if (cache) runBootstrapFromCache(cache);
            else showBootstrapError();
          });
        };
        document.head.appendChild(s);
      }

      function startApp() {
        window.__ngmyHideSplash && window.__ngmyHideSplash();
        registerServiceWorkerBackground();

        openOfflineCache().then(function (cache) {
          return offlineShellReady(cache).then(function (ready) {
            if (ready) {
              return runBootstrapFromCache(cache);
            }
            if (!navigator.onLine) {
              showBootstrapError('Open NGMY once with Wi-Fi on, wait for the home screen, then you can use it offline.');
              return;
            }
            bootFromNetwork();
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }

      window.addEventListener('pagehide', warmOfflineCache);
    })();
  </script>
