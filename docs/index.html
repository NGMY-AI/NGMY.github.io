<body style="overflow: hidden;">
  <!-- Clears stale PWA/service-worker cache when a new build is deployed -->
  <script>
    (function () {
      var CURRENT = "20260529212455";
      var KEY = "ngmy_deploy_id";
      var prev = null;
      try { prev = localStorage.getItem(KEY); } catch (e) {}
      function finish() {
        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}
      }
      if (prev && prev !== CURRENT && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if ("caches" in window) {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }
        }).then(function () {
          try { localStorage.setItem(KEY, CURRENT); } catch (e) {}
          location.reload();
        }).catch(finish);
      } else {
        finish();
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20260529212455"></script>
