<!DOCTYPE html>

<html>

<head>

  <base href="/NGMY.github.io/">

  <script>

    (function () {

      var p = location.pathname || "/";

      if (p.indexOf("/NGMY.github.io") === 0) {

        var b = document.querySelector("base");

        if (b) b.setAttribute("href", "/NGMY.github.io/");

      }

    })();

  </script>



  <meta charset="UTF-8">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description" content="Next Generation - Make Yours">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="NGMY">

  <script>
    (function () {
      function ngmyThemeIsLight() {
        try {
          var keys = ['flutter.theme_mode', 'theme_mode'];
          for (var i = 0; i < keys.length; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'dark') return false;
            if (v === 'light') return true;
          }
        } catch (e) {}
        var h = new Date().getHours();
        return h >= 9 && h < 20;
      }
      function ngmyApplyLightChromeEarly() {
        var root = document.documentElement;
        root.classList.add('ngmy-app-light');
        root.style.setProperty('background-color', '#ffffff', 'important');
        root.style.setProperty('color-scheme', 'light');
        if (document.body) {
          document.body.style.setProperty('background-color', '#ffffff', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#ffffff');
        });
      }
      function ngmyApplyDarkChromeEarly() {
        var root = document.documentElement;
        root.classList.remove('ngmy-app-light');
        root.style.setProperty('background-color', '#121212', 'important');
        root.style.setProperty('color-scheme', 'dark');
        if (document.body) {
          document.body.style.setProperty('background-color', '#121212', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#121212');
        });
      }
      if (ngmyThemeIsLight()) ngmyApplyLightChromeEarly();
      else ngmyApplyDarkChromeEarly();
    })();
  </script>

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NGMY</title>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="manifest.json">

  <!-- Preload icon fonts so Fun & Games / Game Center icons stay visible on slow networks -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin="anonymous">
  <link rel="preload" href="assets/packages/cupertino_icons/assets/CupertinoIcons.ttf" as="font" type="font/ttf" crossorigin="anonymous">



  <style>

    html, body {

      margin: 0;

      padding: 0;

      height: 100%;

      background-color: #ffffff;

      overscroll-behavior-x: none;

    }

    @media (prefers-color-scheme: light) {

      html, body { background-color: #ffffff; }

    }

    flutter-view, flt-glass-pane {

      background-color: #ffffff;

      -webkit-user-select: text;

      user-select: text;

    }

    flt-semantics, .flt-text-editing {

      -webkit-user-select: text;

      user-select: text;

    }

    @media (prefers-color-scheme: light) {

      html, body, flutter-view, flt-glass-pane {

        background-color: #ffffff !important;

      }

    }

    @media (prefers-color-scheme: dark) {

      html, body { background-color: #121212; }

    }

    html.ngmy-app-light,
    html.ngmy-app-light body {

      background-color: #ffffff !important;

      color-scheme: light;

    }

    html.ngmy-app-light flutter-view,
    html.ngmy-app-light flt-glass-pane {

      background-color: #ffffff !important;

    }

    html.ngmy-app-light::before {

      content: '';

      position: fixed;

      top: 0;

      left: 0;

      right: 0;

      height: env(safe-area-inset-top, 0px);

      background: #ffffff;

      z-index: 2147483646;

      pointer-events: none;

    }

    #ngmy-error {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 10000;

      padding: 24px;

      text-align: center;

      background: #121212;

      color: #fff;

      font-family: system-ui, sans-serif;

      align-items: center;

      justify-content: center;

      flex-direction: column;

    }

  </style>

</head>

<body>

  <div id="ngmy-error">

    <p style="font-size:18px;font-weight:800">NGMY could not start</p>

    <p id="ngmy-error-msg" style="opacity:0.8;max-width:320px"></p>

    <button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:none;border-radius:8px;background:#00B25A;color:#fff;font-weight:700">Reload</button>

  </div>

  <script>

    (function () {

      var KEY = "ngmy_deploy_id";

      var CURRENT = "20260608212748";

      function showError(msg) {

        var err = document.getElementById("ngmy-error");

        var msgEl = document.getElementById("ngmy-error-msg");

        if (err) err.style.display = "flex";

        if (msgEl) msgEl.textContent = msg || "Clear site data for this URL, then reload.";

      }

      window.__ngmyShowLoadError = showError;

      try {

        var prev = localStorage.getItem(KEY);

        if (prev && prev !== CURRENT && navigator.onLine && "serviceWorker" in navigator) {

          navigator.serviceWorker.getRegistrations().then(function (regs) {

            return Promise.all(regs.map(function (r) { return r.unregister(); }));

          }).then(function () {

            if ("caches" in window) {

              return caches.keys().then(function (keys) {

                return Promise.all(keys.map(function (k) { return caches.delete(k); }));

              });

            }

          }).catch(function () {});

        }

        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}

      } catch (e) {}

    })();

  </script>

  <script>
    (function () {
      function scrollTopOnce() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      window.addEventListener('pageshow', scrollTopOnce);
    })();
  </script>

  <script>
    (function () {
      var deployId = '20260608212748';
      var bootstrapSrc = 'flutter_bootstrap.js';
      var loadAttempts = 0;

      function showBootstrapError() {
        window.__ngmyShowLoadError && window.__ngmyShowLoadError(
          navigator.onLine
            ? 'Could not load the app. Use this exact link: https://ngmy-ai.github.io/NGMY.github.io/'
            : 'You are offline. Open NGMY once while online so it can save for offline use, then try again.'
        );
      }

      function loadFlutterBootstrap() {
        loadAttempts += 1;
        var s = document.createElement('script');
        s.src = bootstrapSrc;
        s.async = false;
        s.onerror = function () {
          if (loadAttempts < 3) {
            setTimeout(loadFlutterBootstrap, loadAttempts === 1 ? 400 : 1200);
            return;
          }
          showBootstrapError();
        };
        document.body.appendChild(s);
      }

      function startApp() {
        var bootStarted = false;
        var go = function () {
          if (bootStarted) return;
          bootStarted = true;
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadFlutterBootstrap);
          } else {
            loadFlutterBootstrap();
          }
        };
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(go).catch(go);
          setTimeout(go, 2500);
        } else {
          go();
        }
      }

      setTimeout(function () {
        if (!document.querySelector('flutter-view') && !window._flutter) {
          if (!navigator.onLine) showBootstrapError();
        }
      }, 50000);

      if (!('serviceWorker' in navigator)) {
        startApp();
        return;
      }

      navigator.serviceWorker.register('ngmy_service_worker.js?v=' + deployId, { scope: '/NGMY.github.io/' })
        .catch(function (e) {
          console.warn('[ngmy] service worker register failed', e);
        });
      startApp();
    })();
  </script>

</body>

</html>
