<!DOCTYPE html>

  <script>
    (function () {
      function ngmyBasePath() {
        var host = (location.hostname || '').toLowerCase();
        if (host === 'ngmy.org' || host === 'www.ngmy.org') return '/';
        var p = location.pathname || '/';
        if (p.indexOf('/NGMY.github.io') === 0) return '/NGMY.github.io/';
        if (host.indexOf('github.io') !== -1) return '/NGMY.github.io/';
        return '/';
      }
      window.__NGMY_BASE_PATH__ = ngmyBasePath();
      var b = document.querySelector('base');
      if (b) b.setAttribute('href', window.__NGMY_BASE_PATH__);
    })();
  </script>

  <script>
    (function () {
      function ngmyExtractGuestAppSlug() {
        var path = location.pathname || "";
        var m = path.match(/\/app\/([^/?#]+)/i);
        if (m && m[1]) return m[1].trim().toLowerCase();
        try {
          var q = new URLSearchParams(location.search).get("ngmy_app");
          if (q) return q.trim().toLowerCase();
        } catch (e) {}
        var hash = (location.hash || "").replace(/^#\/?/, "");
        if (hash.indexOf("app/") === 0) {
          var part = hash.substring(4).split("/")[0];
          if (part) return part.trim().toLowerCase();
        }
        return "";
      }
      var slug = ngmyExtractGuestAppSlug();
      if (slug) {
        try { sessionStorage.setItem("ngmy_guest_app_slug", slug); } catch (e) {}
        try { document.title = "Loading app…"; } catch (e2) {}
      }
    })();
  </script>

  <script>
    (function () {
      function ngmyThemeIsLight() {
        try {
          var keys = ['flutter.theme_mode', 'theme_mode'];
          for (var i = 0; i < keys.length; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'dark') return false;
            if (v === 'light') return true;
          }
        } catch (e) {}
        var h = new Date().getHours();
        return h >= 9 && h < 20;
      }
      function ngmyApplyLightChromeEarly() {
        var root = document.documentElement;
        root.classList.add('ngmy-app-light');
        root.style.setProperty('background-color', '#ffffff', 'important');
        root.style.setProperty('color-scheme', 'light');
        if (document.body) {
          document.body.style.setProperty('background-color', '#ffffff', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#ffffff');
        });
      }
      function ngmyApplyDarkChromeEarly() {
        var root = document.documentElement;
        root.classList.remove('ngmy-app-light');
        root.style.setProperty('background-color', '#121212', 'important');
        root.style.setProperty('color-scheme', 'dark');
        if (document.body) {
          document.body.style.setProperty('background-color', '#121212', 'important');
        }
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', '#121212');
        });
      }
      if (ngmyThemeIsLight()) ngmyApplyLightChromeEarly();
      else ngmyApplyDarkChromeEarly();
    })();
  </script>

    html, body {

      margin: 0;

      padding: 0;

      height: 100%;

      background-color: #ffffff;

      background-color: #ffffff;

      -webkit-user-select: text;

      user-select: text;

    }

    flt-semantics, .flt-text-editing {

      user-select: text;

    html.ngmy-app-light::before {

      left: 0;

      right: 0;

      height: env(safe-area-inset-top, 0px);

      background: #ffffff;

      z-index: 2147483646;

      pointer-events: none;

    #ngmy-splash {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 16px;

      font-family: system-ui, sans-serif;

    }

    #ngmy-splash .ngmy-spin {

      width: 40px;

      height: 40px;

      border: 3px solid rgba(0, 178, 90, 0.25);

      border-top-color: #00B25A;

      border-radius: 50%;

      animation: ngmy-spin 0.9s linear infinite;

    }

    @keyframes ngmy-spin {

      to { transform: rotate(360deg); }

    }

    #ngmy-splash p {

      font-size: 14px;

      font-weight: 600;

    }

      inset: 0;

      z-index: 10000;

      text-align: center;

      background: #121212;

      color: #fff;

      font-family: system-ui, sans-serif;

      align-items: center;

      justify-content: center;

      flex-direction: column;

    }

  <script>

    (function () {

      var KEY = "ngmy_deploy_id";

      var CURRENT = "__NGMY_DEPLOY_ID__";

      function showError(msg) {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

        var err = document.getElementById("ngmy-error");

        var msgEl = document.getElementById("ngmy-error-msg");

        if (err) err.style.display = "flex";

        if (msgEl) msgEl.textContent = msg || "Clear site data for this URL, then reload.";

      }

      function hideSplash() {

        var splash = document.getElementById("ngmy-splash");

        if (splash) splash.style.display = "none";

      }

      window.__ngmyShowLoadError = showError;
      window.__ngmyHideSplash = hideSplash;

      try {

        var prev = localStorage.getItem(KEY);

        // New deploy: let the service worker swap caches on activate — do not wipe
        // storage here or offline cold start breaks before the new shell is cached.

        try { localStorage.setItem(KEY, CURRENT); } catch (e) {}

      } catch (e) {}

    })();

  </script>

  <script>
    (function () {
      function scrollTopOnce() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      window.addEventListener('pageshow', scrollTopOnce);
    })();
  </script>

  <script>
    (function () {
      var deployId = '__NGMY_DEPLOY_ID__';
      var loadAttempts = 0;
      var flutterStarted = false;
      var swScope = window.__NGMY_BASE_PATH__ || '/';

      var OFFLINE_CRITICAL = [
        'flutter_bootstrap.js',
        'flutter.js',
        'main.dart.js',
        'canvaskit/canvaskit.js',
        'canvaskit/canvaskit.wasm',
        'assets/AssetManifest.bin.json',
        'assets/FontManifest.json',
      ];

      function showBootstrapError(hint) {
        var msg = hint || (navigator.onLine
            ? 'Could not load the app. Try https://ngmy.org/ or clear site data and reload.'
            : 'Open NGMY once with Wi-Fi on, wait for the home screen, then you can use it offline.');
        window.__ngmyShowLoadError && window.__ngmyShowLoadError(msg);
      }

      function pathFromUrl(src) {
        try {
          var u = new URL(src, location.href);
          if (u.origin !== location.origin) return null;
          var p = u.pathname || '';
          var base = swScope || '/';
          if (base !== '/' && p.indexOf(base) === 0) {
            p = p.substring(base.length);
          }
          if (p.charAt(0) === '/') p = p.substring(1);
          return p;
        } catch (e) {
          return null;
        }
      }

      function openOfflineCache() {
        if (!('caches' in window)) return Promise.resolve(null);
        return caches.keys().then(function (keys) {
          var ngmyKeys = keys.filter(function (k) { return k.indexOf('ngmy-pwa-') === 0; });
          if (!ngmyKeys.length) return null;
          return caches.open(ngmyKeys[ngmyKeys.length - 1]);
        });
      }

      function loadFromCache(cache, path) {
        if (!cache || !path) return Promise.resolve(null);
        var candidates = ['./' + path, path];
        var chain = Promise.resolve(null);
        candidates.forEach(function (u) {
          chain = chain.then(function (hit) {
            if (hit) return hit;
            return cache.match(u);
          });
        });
        return chain.then(function (hit) {
          if (hit) return hit;
          return cache.keys().then(function (reqs) {
            for (var i = 0; i < reqs.length; i++) {
              var reqUrl = reqs[i].url || '';
              if (reqUrl.indexOf(path) !== -1) {
                return cache.match(reqs[i]);
              }
            }
            return null;
          });
        });
      }

      function warmOfflineCache() {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        try {
          navigator.serviceWorker.controller.postMessage({
            type: 'ENSURE_CACHED',
            urls: OFFLINE_CRITICAL,
          });
        } catch (e) {}
      }

      function installOfflineNetworkHooks(blobMap) {
        if (navigator.onLine || !blobMap) return;

        var srcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
        if (srcDesc && srcDesc.set) {
          Object.defineProperty(HTMLScriptElement.prototype, 'src', {
            get: srcDesc.get,
            set: function (val) {
              var mapped = val;
              try {
                var path = pathFromUrl(val);
                if (path) {
                  mapped = blobMap[path] || blobMap['./' + path] || val;
                }
              } catch (e) {}
              srcDesc.set.call(this, mapped);
            },
            configurable: true,
          });
        }

        if (window.fetch && !window.__ngmyFetchHooked) {
          window.__ngmyFetchHooked = true;
          var origFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            if (!navigator.onLine) {
              var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
              var path = pathFromUrl(url);
              if (path) {
                return openOfflineCache().then(function (cache) {
                  return loadFromCache(cache, path).then(function (hit) {
                    if (hit) return hit;
                    return origFetch(input, init);
                  });
                });
              }
            }
            return origFetch(input, init);
          };
        }
      }

      function prepareOfflineBlobs(cache) {
        var blobMap = {};
        var jobs = OFFLINE_CRITICAL.map(function (path) {
          return loadFromCache(cache, path).then(function (hit) {
            if (!hit) return;
            return hit.blob().then(function (blob) {
              blobMap[path] = URL.createObjectURL(blob);
              blobMap['./' + path] = blobMap[path];
            });
          });
        });
        return Promise.all(jobs).then(function () { return blobMap; });
      }

      function ensureSwControlOffline() {
        if (navigator.onLine || !('serviceWorker' in navigator)) return Promise.resolve();
        if (navigator.serviceWorker.controller) return Promise.resolve();
        try {
          if (!sessionStorage.getItem('ngmy_off_reload')) {
            sessionStorage.setItem('ngmy_off_reload', '1');
            return navigator.serviceWorker
              .register('ngmy_service_worker.js?v=' + deployId, { scope: swScope })
              .then(function () {
                window.location.reload();
                return new Promise(function () {});
              });
          }
          sessionStorage.removeItem('ngmy_off_reload');
        } catch (e) {}
        return Promise.resolve();
      }

      function waitForServiceWorker() {
        if (!('serviceWorker' in navigator)) return Promise.resolve();
        return ensureSwControlOffline().then(function () {
          return navigator.serviceWorker
            .register('ngmy_service_worker.js?v=' + deployId, { scope: swScope })
            .then(function () { return navigator.serviceWorker.ready; })
            .then(function () {
              if (navigator.serviceWorker.controller) return;
              return new Promise(function (resolve) {
                var done = false;
                function finish() {
                  if (!done) { done = true; resolve(); }
                }
                navigator.serviceWorker.addEventListener('controllerchange', finish, { once: true });
                setTimeout(finish, 10000);
              });
            });
        }).catch(function (e) {
          console.warn('[ngmy] service worker register failed', e);
        });
      }

      function offlineShellReady(cache) {
        if (!cache) return Promise.resolve(false);
        var required = ['flutter_bootstrap.js', 'main.dart.js', 'canvaskit/canvaskit.wasm'];
        return Promise.all(required.map(function (p) {
          return loadFromCache(cache, p).then(function (hit) { return !!hit; });
        })).then(function (results) { return results.every(Boolean); });
      }

      function watchFlutterStart() {
        var obs = new MutationObserver(function () {
          if (
            document.querySelector('flutter-view') ||
            document.querySelector('flt-glass-pane') ||
            (window._flutter && document.querySelector('canvas'))
          ) {
            flutterStarted = true;
            window.__ngmyHideSplash && window.__ngmyHideSplash();
            warmOfflineCache();
            obs.disconnect();
          }
        });
        if (document.body) {
          obs.observe(document.body, { childList: true, subtree: true });
        }
        setTimeout(function () {
          if (flutterStarted) return;
          if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) return;
          showBootstrapError(
            navigator.onLine
              ? 'The app is taking too long to start. Check your connection and reload.'
              : 'Offline startup failed. Open NGMY with Wi-Fi on, wait for the home screen, then try again.'
          );
        }, 90000);
      }

      function runBootstrapFromCache(cache) {
        loadAttempts += 1;
        return prepareOfflineBlobs(cache).then(function (blobMap) {
          installOfflineNetworkHooks(blobMap);
          return loadFromCache(cache, 'flutter_bootstrap.js').then(function (hit) {
            if (!hit) throw new Error('bootstrap missing');
            return hit.text().then(function (code) {
              var s = document.createElement('script');
              s.textContent = code;
              s.async = false;
              document.head.appendChild(s);
              watchFlutterStart();
            });
          });
        }).catch(function () {
          if (loadAttempts < 2) {
            return new Promise(function (resolve) {
              setTimeout(function () { resolve(runBootstrapFromCache(cache)); }, 800);
            });
          }
          showBootstrapError();
        });
      }

      function loadFlutterBootstrapOnline() {
        loadAttempts += 1;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = false;
        s.onload = function () { watchFlutterStart(); };
        s.onerror = function () {
          if (loadAttempts < 3) {
            setTimeout(loadFlutterBootstrapOnline, loadAttempts === 1 ? 400 : 1200);
            return;
          }
          showBootstrapError();
        };
        document.body.appendChild(s);
      }

      function bootApp(cache, offline) {
        function go() {
          if (offline && cache) {
            runBootstrapFromCache(cache);
          } else {
            loadFlutterBootstrapOnline();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', go);
        } else {
          go();
        }
      }

      function startApp() {
        var splashMsg = document.getElementById('ngmy-splash-msg');
        if (!navigator.onLine) {
          if (splashMsg) splashMsg.textContent = 'Opening offline...';
          return openOfflineCache().then(function (cache) {
            return offlineShellReady(cache).then(function (ready) {
              if (!ready) {
                showBootstrapError(
                  'Not saved for offline yet. Open NGMY with Wi-Fi on, wait for the home screen, then try again.'
                );
                return;
              }
              bootApp(cache, true);
            });
          });
        }
        if (splashMsg) splashMsg.textContent = 'Loading NGMY...';
        warmOfflineCache();
        bootApp(null, false);
      }

      waitForServiceWorker().then(startApp);

      window.addEventListener('pagehide', function () {
        if (navigator.onLine) warmOfflineCache();
      });
    })();
  </script>
